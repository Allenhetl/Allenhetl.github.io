    Publications:
      - title: Embodied 4D World Model for Robotic Manipulation
        authors: He, Tianlun and others
        venue: ICML 2026
        date: 2026-04
        url: https://arxiv.org/abs/2602.09878
        summary: "A 4D world model that takes a single-view RGBD input and produces multi-view-consistent 3D/4D scene representations, enabling 'imagine-then-act' decisions for manipulation."

    Projects:
      - name: "Memory VLA — long-horizon manipulation"
        date: "2026.02 – ongoing"
        role: "Research lead"
        summary: "Hierarchical task decomposition + fixed-capacity Implicit Memory Bank with cross-attention modulation; targeting ICRA 2027."

      - name: "Embodied 4D World Model for Robotic Manipulation"
        date: "2025.12 – 2026.02"
        role: "Research assistant — real-robot platform & multi-view RGBD pipeline"
        summary: "Built the physical robot platform, multi-camera calibration / time-sync / cross-view alignment pipeline, and 4D manipulation dataset. Validated 'imagine-then-act' on real hardware. Accepted to ICML 2026."

      - name: "Indoor Structural Semantic Segmentation (Sonata + PTV3)"
        date: "2025.12 – 2026.01"
        role: "Researcher"
        summary: "Point-cloud segmentation system for ceiling / wall / floor / bay-window / glass classes. Built a Blender-based 3D point-cloud labelling plugin and end-to-end training pipeline (mIoU evaluation, class-imbalance tuning)."

      - name: "6-DOF Underwater Autonomous Robot"
        date: "2025.08 – 2025.12"
        role: "Full-stack — mechanical + embedded + algorithm"
        summary: "Six-DOF cascaded PID (position + velocity loop), YOLO-based underwater target detection, mechanical sealing and buoyancy trim, end-to-end perception → planning → execution loop."

      - name: "RL-based Bipedal Locomotion (sim-to-real prep)"
        date: "2024.12 – 2025.06"
        role: "Research assistant"
        summary: "PPO training in IsaacGym with curriculum-shaped rewards; built a motor torque test bench and current-torque identification model for sim-to-real transfer."

      - name: "Omnidirectional Autonomous Wheelchair"
        date: "2024.09 – 2025.06"
        role: "Team lead"
        summary: "Rudder-wheel chassis + LiDAR-based autonomous navigation. Owned mechanical design, kinematics solver, embedded integration, and team coordination across mechanical / embedded / navigation tracks."

