  summary: >
    Year-3 undergraduate at the **Hong Kong University of Science and Technology**
    (Integrative Systems and Design, Minor in Robotics) — **top 10%** of cohort.
    Embodied-AI researcher focused on **vision-language-action (VLA) models**, **world models**
    for manipulation, and **sim-to-real reinforcement learning**.
    First-author publication at **ICML 2026**. Two-year **Mechanical Lead**
    at HKUST RoboMaster ENTERPRIZE; **RMUC 2024 International Champion**.

  social_networks:
    - network: GitHub
      username: Allenhetl

