        start_date: 2023-09
        end_date: 2027-06
        score: "**Top 10% of cohort** — CGA 3.42 / 4.3, MCGA 3.50 / 4.3"
        highlights:
          - "**Major** — Integrative Systems and Design"
          - "**Minor** — Robotics"
          - "**HKSAR Talent Development Scholarship**, 2024/25"

    Experience:
      - company: HKUST RoboMaster Team ENTERPRIZE
        position: Head of Mechanical Department
        location: Hong Kong
        start_date: 2023-11
        end_date: 2025-08
        summary: Mechanical lead for the team representing HKUST in the DJI-organised RoboMaster collegiate robotics championship.
        highlights:
          - "**Team management** — directed an 11-person mechanical team; owned seasonal technical roadmap, task breakdown, and parallel multi-robot R&D scheduling."
          - "**Cross-department interface** with electrical, vision, and hardware; standardised mech-electrical interfaces and routing to cut integration rework."
          - "**Personal contributions** — independent design of serial-leg infantry, rudder-wheel infantry gimbal, and quadcopter UAV (CAD → simulation → manufacture → integration → debug)."
          - "**Open-source impact** — multiple core mechanical designs published to the RoboMaster community ([article #542](https://bbs.robomaster.com/article/542))."
          - "**Awards while in role** — RMUC 2024 International Champion · RoboMaster 2025 University League Champion · RMUC 2025 National runner-up · RMUL 2024 regional runner-up."

      - company: WeShareTech Limited
        position: Hardware Development Intern
        location: China · Electronics / Communication / Hardware
        start_date: 2024-10
        end_date: 2025-01
        summary: Laboratory chemical-reagent management — winter co-development project.
        highlights:
          - "Designed an **RFID-based smart-weighing system** for chemistry-lab reagent management; automated reagent identification and weight logging."
          - "Owned **mechanical structure design** (scale body), sensor + RFID module selection, and the system-integration plan."
          - "Built and validated the **prototype end-to-end**, from CAD to bench testing."

    Publications:
      - title: Embodied 4D World Model for Robotic Manipulation
        publisher: ICML 2026
        date: 2026-04
        url: https://arxiv.org/abs/2602.09878
        summary: "First-author work. A 4D world model that takes single-view RGBD input and produces multi-view-consistent 3D/4D scene representations, enabling an *imagine-then-act* decision paradigm for manipulation. End-to-end loop from sensor capture, multi-view reconstruction, dataset construction, and model training, to real-robot validation."

    Projects:
      - name: "Memory VLA — long-horizon manipulation"
        url: ""
        summary: "Hierarchical task decomposition + fixed-capacity Implicit Memory Bank with cross-attention modulation. Targeting **ICRA 2027**. *Research lead, 2026.02 – ongoing.*"
        highlights:
          - "**Architecture** — hierarchical task decomposition, sub-task boundary detector, fixed-capacity Implicit Memory Bank, memory-action cross-attention interface."
          - "**Implementation** — full PyTorch training & inference pipeline; multi-GPU distributed training; sim-to-real validation on a real arm."
          - "**Evaluation** — RMBench / VLABench / LIBERO-Long against Mem-0, MEM, MemER, CronusVLA baselines."

      - name: "Embodied 4D World Model for Robotic Manipulation (ICML 2026)"
        url: https://arxiv.org/abs/2602.09878
        summary: "*Research assistant, 2025.12 – 2026.02.* Built the physical robot platform, multi-camera calibration / time-sync / cross-view alignment pipeline, and 4D manipulation dataset. Validated *imagine-then-act* on real hardware. Accepted to **ICML 2026**."

      - name: "Indoor Structural Semantic Segmentation (Sonata + PTV3)"
        summary: "*Researcher, 2025.12 – 2026.01.* Point-cloud segmentation for ceiling / wall / floor / bay-window / glass classes. Built a Blender-based 3D point-cloud labelling plugin and end-to-end training pipeline (mIoU evaluation, class-imbalance tuning)."

      - name: "6-DOF Underwater Autonomous Robot"
        summary: "*Full-stack — mechanical + embedded + algorithm, 2025.08 – 2025.12.* Six-DOF cascaded PID (position + velocity loop), YOLO-based underwater target detection, mechanical sealing and buoyancy trim — end-to-end perception → planning → execution loop."

      - name: "RL-based Bipedal Locomotion (sim-to-real prep)"
        summary: "*Research assistant, 2024.12 – 2025.06.* PPO training in IsaacGym with curriculum-shaped rewards; built a motor torque test bench and current-torque identification model for sim-to-real transfer."

      - name: "Omnidirectional Autonomous Wheelchair"
        summary: "*Team lead, 2024.09 – 2025.06.* Rudder-wheel chassis + LiDAR-based autonomous navigation. Owned mechanical design, kinematics solver, embedded integration, and team coordination across mechanical / embedded / navigation tracks."

