<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="4D world model concept diagram">
  <defs>
    <pattern id="wm-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2f4bd8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="#fdfcfa"/>
  <rect width="600" height="400" fill="url(#wm-grid)"/>
  <g fill="none" stroke="#2f4bd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- single-view RGBD camera (input) -->
    <rect x="46" y="170" width="64" height="46" rx="4" stroke-opacity="0.9"/>
    <circle cx="78" cy="193" r="13" stroke-opacity="0.9"/>
    <path d="M110 193 H170" stroke-opacity="0.5" stroke-dasharray="2 7"/>
    <!-- multi-view reconstructed cube (4D scene) -->
    <g stroke-opacity="0.95">
      <path d="M250 120 L340 120 L340 230 L250 230 Z"/>
      <path d="M250 120 L300 86 L390 86 L340 120"/>
      <path d="M340 230 L390 196 L390 86"/>
      <path d="M250 230 L300 196 L390 196" stroke-opacity="0.55"/>
      <path d="M300 196 L300 86" stroke-opacity="0.55"/>
    </g>
    <!-- multi-view camera fan (consistency) -->
    <g stroke-opacity="0.5" stroke-dasharray="2 7">
      <path d="M390 140 H470"/>
      <path d="M390 176 H470"/>
    </g>
    <circle cx="494" cy="140" r="11" stroke-opacity="0.9"/>
    <circle cx="494" cy="176" r="11" stroke-opacity="0.9"/>
    <!-- imagine-then-act arrow -->
    <path d="M250 300 H470" stroke-opacity="0.85"/>
    <path d="M458 290 L472 300 L458 310" stroke-opacity="0.85"/>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2f4bd8" fill-opacity="0.85" font-size="15">
    <text x="46" y="248">RGBD in</text>
    <text x="250" y="74">4D scene</text>
    <text x="250" y="332">imagine → act</text>
  </g>
  <text x="566" y="372" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#18191d" fill-opacity="0.4">MVISTA-4D · ICML 2026</text>
</svg>
