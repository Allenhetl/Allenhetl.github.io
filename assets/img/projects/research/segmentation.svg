<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Indoor semantic segmentation concept diagram">
  <defs>
    <pattern id="sg-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2f4bd8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="#fdfcfa"/>
  <rect width="600" height="400" fill="url(#sg-grid)"/>
  <!-- isometric room: ceiling / wall / floor planes, segmented -->
  <g fill="none" stroke="#2f4bd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- floor -->
    <path d="M300 330 L150 250 L300 170 L450 250 Z" stroke-opacity="0.9"/>
    <!-- left wall -->
    <path d="M150 250 L150 130 L300 50 L300 170 Z" stroke-opacity="0.9"/>
    <!-- right wall -->
    <path d="M450 250 L450 130 L300 50 L300 170 Z" stroke-opacity="0.55"/>
    <!-- bay window on left wall -->
    <path d="M186 168 L186 120 L252 82 L252 130 Z" stroke-opacity="0.7"/>
  </g>
  <!-- point-cloud dots (segmented classes) -->
  <g fill="#2f4bd8">
    <g fill-opacity="0.85">
      <circle cx="220" cy="210" r="3"/><circle cx="252" cy="228" r="3"/><circle cx="284" cy="246" r="3"/>
      <circle cx="316" cy="228" r="3"/><circle cx="348" cy="210" r="3"/><circle cx="300" cy="262" r="3"/>
    </g>
    <g fill-opacity="0.5">
      <circle cx="206" cy="150" r="3"/><circle cx="206" cy="186" r="3"/><circle cx="240" cy="130" r="3"/>
      <circle cx="372" cy="150" r="3"/><circle cx="372" cy="186" r="3"/><circle cx="338" cy="130" r="3"/>
    </g>
    <g fill-opacity="0.3">
      <circle cx="218" cy="120" r="3"/><circle cx="220" cy="146" r="3"/>
    </g>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2f4bd8" fill-opacity="0.85" font-size="15">
    <text x="150" y="360">floor</text>
    <text x="150" y="115">wall · window</text>
  </g>
  <text x="566" y="372" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#18191d" fill-opacity="0.4">Sonata + PTV3</text>
</svg>
