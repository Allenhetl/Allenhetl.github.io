<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" role="img" aria-label="Memory-augmented VLA concept diagram">
  <defs>
    <pattern id="mv-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#2f4bd8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="600" height="400" fill="#fdfcfa"/>
  <rect width="600" height="400" fill="url(#mv-grid)"/>
  <g fill="none" stroke="#2f4bd8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- vision + language inputs -->
    <rect x="44" y="96" width="78" height="48" rx="4" stroke-opacity="0.9"/>
    <path d="M56 120 H110" stroke-opacity="0.45"/>
    <rect x="44" y="166" width="78" height="48" rx="4" stroke-opacity="0.9"/>
    <path d="M56 184 H100 M56 196 H92" stroke-opacity="0.45"/>
    <!-- policy core -->
    <circle cx="300" cy="170" r="46" stroke-opacity="0.95"/>
    <path d="M122 120 C200 140 230 150 258 160" stroke-opacity="0.55" stroke-dasharray="2 7"/>
    <path d="M122 190 C200 184 226 180 256 176" stroke-opacity="0.55" stroke-dasharray="2 7"/>
    <!-- implicit memory bank (stacked, fixed capacity) -->
    <g stroke-opacity="0.9">
      <rect x="270" y="300" width="60" height="16" rx="2"/>
      <rect x="270" y="320" width="60" height="16" rx="2"/>
      <rect x="270" y="340" width="60" height="16" rx="2"/>
    </g>
    <!-- memory <-> policy cross-attention (bidirectional) -->
    <path d="M300 300 V216" stroke-opacity="0.7"/>
    <path d="M293 232 L300 218 L307 232" stroke-opacity="0.7"/>
    <path d="M307 284 L300 298 L293 284" stroke-opacity="0.7"/>
    <!-- action output over long horizon -->
    <path d="M346 170 H520" stroke-opacity="0.85"/>
    <path d="M508 160 L522 170 L508 180" stroke-opacity="0.85"/>
    <circle cx="392" cy="170" r="3.5" fill="#2f4bd8" stroke="none" fill-opacity="0.8"/>
    <circle cx="436" cy="170" r="3.5" fill="#2f4bd8" stroke="none" fill-opacity="0.8"/>
    <circle cx="480" cy="170" r="3.5" fill="#2f4bd8" stroke="none" fill-opacity="0.8"/>
  </g>
  <g font-family="ui-monospace,Menlo,Consolas,monospace" fill="#2f4bd8" fill-opacity="0.85" font-size="15">
    <text x="44" y="86">vision / language</text>
    <text x="262" y="382">memory bank</text>
    <text x="436" y="150" text-anchor="middle">actions →</text>
  </g>
  <text x="566" y="372" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="13" fill="#18191d" fill-opacity="0.4">Memory-Augmented VLA</text>
</svg>
